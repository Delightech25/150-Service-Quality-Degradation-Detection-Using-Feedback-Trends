<html>

<head>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>



<div class="sidebar">

<h2>Analytics</h2>

<a href="/dashboard">Dashboard</a>

<a href="/predict">Prediction</a>

<a href="/logout">Logout</a>

</div>



<div class="main">

<div class="header">

Service Quality Dashboard

</div>


<div class="cards">


<div class="card">

<h3>Total Reviews</h3>

<h2>{{total_reviews}}</h2>

</div>


<div class="card">

<h3>Average Rating</h3>

<h2>{{avg_rating}}</h2>

</div>


<div class="card">

<h3>Low Ratings</h3>

<h2>{{low_rating}}</h2>

</div>


<div class="card">

<h3>High Ratings</h3>

<h2>{{high_rating}}</h2>

</div>


<div class="card">

<h3>Status</h3>

<h2>{{status}}</h2>

</div>


</div>



<div class="chart">

<h3>Rating Trend</h3>

<img src="/static/trend.png" width="600">

</div>



<div class="chart">

<h3>Category Analysis</h3>

<img src="/static/category.png" width="600">

</div>


</div>


</body>

</html>
